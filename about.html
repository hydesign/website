<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="ico.png" type="image/png">
  <title>About — aryyuehuang</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/favorit-font-family.css">
  <link rel="stylesheet" href="css/diatype-font-family.css">
  <link rel="stylesheet" href="css/abc-arizona-font.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500&family=IBM+Plex+Mono:wght@350;400&family=Georgia:ital@0;1&display=swap" rel="stylesheet">
</head>
<body class="page-arizona-sans">
  <div id="header-placeholder"></div>

  <main class="page-wrapper">
  <div class="content content-wide">
    <section class="about-section">
      <div class="cv-lang-toggle">
        <button type="button" class="cv-lang-btn active" data-lang="en">EN</button>
        <button type="button" class="cv-lang-btn" data-lang="zh">CH</button>
      </div>

      <h2 class="section-title" id="about-bio-title"></h2>
      <p class="about-bio" id="about-bio-text"></p>

      <h2 class="section-title" id="about-practice-title"></h2>
      <div id="about-practice-text"></div>

      <h2 class="section-title"><span class="cv-label-en">CV</span><span class="cv-label-zh">简历</span></h2>
      
      <h3 class="cv-category"><span class="cv-label-en">Education</span><span class="cv-label-zh">教育背景</span></h3>
      <ul class="cv-list cv-education-list" id="cv-education-list"></ul>

      <h3 class="cv-category"><span class="cv-label-en">Exhibition</span><span class="cv-label-zh">展览</span></h3>
      <ul class="cv-list cv-exhibition-list" id="cv-exhibition-list"></ul>

      <h3 class="cv-category"><span class="cv-label-en">Honors</span><span class="cv-label-zh">荣誉</span></h3>
      <ul class="cv-list cv-honors-list" id="cv-honors-list"></ul>
    </section>
  </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="js/include.js"></script>
  <script src="js/cv-data.js"></script>
  <script>
  (function() {
    var aboutData = window.CV_ABOUT;
    var educationData = window.CV_EDUCATION;
    var exhibitionData = window.CV_EXHIBITION;
    var honorsData = window.CV_HONORS;
    var bioTitleEl = document.getElementById('about-bio-title');
    var bioTextEl = document.getElementById('about-bio-text');
    var practiceTitleEl = document.getElementById('about-practice-title');
    var practiceTextEl = document.getElementById('about-practice-text');
    var educationList = document.getElementById('cv-education-list');
    var exhibitionList = document.getElementById('cv-exhibition-list');
    var honorsList = document.getElementById('cv-honors-list');
    var lang = 'en';

    function render() {
      var about = aboutData[lang];
      var edu = educationData[lang];
      var ex = exhibitionData[lang];
      var hon = honorsData[lang];

      if (bioTitleEl) bioTitleEl.textContent = about.bioTitle;
      if (bioTextEl) bioTextEl.textContent = about.bio;
      if (practiceTitleEl) practiceTitleEl.textContent = about.practiceTitle;
      if (practiceTextEl) {
        practiceTextEl.innerHTML = about.practice.map(function(p) {
          return '<p class="about-intro">' + p + '</p>';
        }).join('');
      }

      educationList.innerHTML = edu.map(function(item) {
        return '<li><strong>' + item.period + '</strong> — ' + item.text + '</li>';
      }).join('');
      exhibitionList.innerHTML = ex.map(function(group) {
        return group.items.map(function(item) {
          return '<li><strong>' + group.year + '</strong> ' + item + '</li>';
        }).join('');
      }).join('');
      honorsList.innerHTML = hon.map(function(item) {
        return '<li>' + item + '</li>';
      }).join('');
      document.querySelectorAll('.cv-label-en').forEach(function(el) { el.style.display = lang === 'en' ? 'inline' : 'none'; });
      document.querySelectorAll('.cv-label-zh').forEach(function(el) { el.style.display = lang === 'zh' ? 'inline' : 'none'; });
    }

    document.querySelectorAll('.cv-lang-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        lang = this.dataset.lang;
        document.querySelectorAll('.cv-lang-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        render();
      });
    });

    render();
  })();
  </script>
</body>
</html>
